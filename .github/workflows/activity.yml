# Draws the "Town activity" widgets for the profile README: the contribution snake and the 3D
# contribution city, in the town's colours (light) and the Dev Center's (dark). Everything else in
# README.md and readme/ is generated by dan-town's CI from dan-profile; don't edit it here.
name: Town activity

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2bb3a3&color_dots=#f6ead6,#d7efc0,#b6e88b,#86c75e,#4f9d4a
            dist/snake-dark.svg?color_snake=#3ee6ff&color_dots=#111a33,#16324a,#1f6f7a,#2bb3a3,#7dffb0

      - name: 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp dist/snake-light.svg dist/snake-dark.svg out/
          cp profile-3d-contrib/profile-green-animate.svg out/profile-3d-light.svg
          cp profile-3d-contrib/profile-night-view.svg out/profile-3d-dark.svg
          cd out
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Town activity $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
